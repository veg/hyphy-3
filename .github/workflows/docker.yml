name: Docker

# Builds the container image and smoke-tests it. Runs only when something the
# image build depends on changes.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - CMakeLists.txt
      - cmake/**
      - src/**
      - include/**
      - viz/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - CMakeLists.txt
      - cmake/**
      - src/**
      - include/**
      - viz/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hyphy3:ci .
      - name: Smoke test (default command prints help)
        run: docker run --rm hyphy3:ci
      - name: Smoke test (version)
        run: docker run --rm hyphy3:ci hyphy3 --version
      - name: Smoke test (no entrypoint, shell command works)
        run: docker run --rm hyphy3:ci sh -c "hyphy3-fel --help"
      - name: Smoke test (every installed binary starts)
        run: docker run --rm hyphy3:ci sh -c 'for b in /usr/local/bin/hyphy3*; do "$b" --help >/dev/null || { echo "FAIL $b"; exit 1; }; done'
